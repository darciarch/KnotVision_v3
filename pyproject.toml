[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "img2texcelle"
version = "2.0.0"
description = "Convert a flat carpet design image into a Texcelle indexed TIFF/BMP (one yarn per palette entry, one knot per pixel)"
requires-python = ">=3.10"
dependencies = [
    "pillow",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
img2texcelle = "img2texcelle.cli:main"
img2texcelle-split = "img2texcelle.split:main"
img2texcelle-assemble = "img2texcelle.assemble:main"

[tool.setuptools]
packages = ["img2texcelle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
